<svg fill="none" viewBox="0 0 240 120" width="100%" height="120" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
            background-color: #FFF5F7;
            background-size: 20px 20px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .floating-text {
          font-family: 'JetBrains Mono', 'Fira Code', Inter, sans-serif;
          font-size: 28px;
          font-weight: bold;
          color: #FF6B81;
          letter-spacing: 2px;
          
          animation: float 3s ease-in-out infinite;
          
          /* 开启 GPU 硬件加速 */
          transform-translate: translate3d(0, 0, 0);
          will-change: transform;
        }

        @keyframes float {
          0% {
            transform: translateY(0px);
          }
          50% {
            transform: translateY(-10px);
          }
          100% {
            transform: translateY(0px);
          }
        }

      </style>
      
      <div class="container">
        <h2 class="floating-text">🌸 丽丽云</h2>
      </div>
    </div>
  </foreignObject>
</svg>